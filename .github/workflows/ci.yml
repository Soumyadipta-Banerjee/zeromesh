name: ZeroMesh CI

on:
  push:
    branches: [ main, master, develop, 'restructure/**', 'stream/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++ pkg-config bubblewrap \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev protobuf-compiler \
            libsodium-dev libssl-dev python3-grpcio python3-grpc-tools cmake

      - name: Allow unprivileged user namespaces (needed by bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: make build

      - name: Test
        run: make test
        # integration_reapi skips cleanly when recc is not installed
