name: ZeroMesh CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build & Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++ bubblewrap libssl-dev

      - name: Verify C++20 header contracts
        run: |
          make check

      - name: Configure Meson build
        run: |
          make setup
          make build
