[build-system]
requires = ["setuptools>=61.0", "wheel", "grpcio-tools>=1.84.0,<1.85"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromesh"
version = "0.1.0"
description = "ZeroMesh Python SDK for zero-setup compute mesh"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "grpcio-tools>=1.84.0,<1.85",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeromesh*"]
