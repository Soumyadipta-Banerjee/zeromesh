# ZeroMesh runs tasks under bubblewrap in an unprivileged user namespace.
# Ubuntu's AppArmor policy for unprivileged userns blocks lo setup inside
# the sandbox ("bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted"),
# which makes remote compiles fail. Donors and requesters both need this.
kernel.apparmor_restrict_unprivileged_userns = 0
