[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zm-render"
version = "0.1.0"
description = "Distribute Blender frame renders across a ZeroMesh team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "zeromesh",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zm-render = "zm_render.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zm_render*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
