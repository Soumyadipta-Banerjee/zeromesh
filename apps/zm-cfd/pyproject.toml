[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zm-cfd"
version = "0.1.0"
description = "Run independent OpenFOAM case sweeps across a ZeroMesh team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["zeromesh"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
zm-cfd = "zm_cfd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zm_cfd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
