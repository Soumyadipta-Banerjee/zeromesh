syntax = "proto3";

package zeromesh.v1;

import "zeromesh/v1/common.proto";

message AdmitHello {
  string node_id = 1;
  bytes nonce = 2;
}
message AdmitChallenge {
  string node_id = 1;
  bytes nonce = 2;
  bytes mac = 3;
}
message AdmitProof { bytes mac = 1; }

message Offer {
  string task_id = 1;
  TaskSpec spec = 2;
  repeated Digest needed = 3;
}
message OfferReply {
  bool accepted = 1;
  string reason = 2;
  repeated Digest missing = 3;
  // Owner-comfort ladder step on the donor (0 = unthrottled .. 4 = frozen). Set on accept and reject.
  uint32 comfort_level = 4;
  // The donor's own departure hazard (expected abrupt departures per hour), when it has a
  // record to report one from. Absent = unknown. Informational for the placer.
  optional double hazard_per_hour = 5;
  // Why the offer was rejected, so the placer need not parse `reason`. UNSPECIFIED (an older
  // donor, or accepted) makes the placer fall back to matching the prose.
  RejectKind reject_kind = 6;
  // How long to wait before offering this donor work again. Set with DRAINING and BUSY.
  uint32 retry_after_ms = 7;
  // Cores this donor donates in total (its donor policy's limit, not the machine size). Absent
  // = unknown (an older donor, or rejected before it was computed).
  optional uint32 core_limit = 8;
}
enum RejectKind {
  REJECT_UNSPECIFIED = 0;
  // The donor is leaving; look again after retry_after_ms.
  REJECT_DRAINING = 1;
  // Passing: cores or memory taken, owner busy, battery low. Look again after retry_after_ms.
  REJECT_BUSY = 2;
  // This donor cannot run this task as specified (no such command or env, other toolchain,
  // needs network or more cores than it donates). Try another donor.
  REJECT_UNSUPPORTED = 3;
}

// Peer seeding (claim 1): asks the callee to fetch `digests` from another team peer
// instead of receiving them from the caller. Optional and additive: a callee that does not
// know the RPC answers UNIMPLEMENTED and the caller pushes the blobs itself.
message SeedRequest {
  string source_hint = 1;        // node id of the peer to fetch from
  repeated Digest digests = 2;
}
message SeedReply {
  repeated Digest fetched = 1;   // those now present on the callee, however they got there
  string error = 2;              // why the rest was not fetched, if it was not
}

message RunRequest {
  string task_id = 1;
  // Optional: id (SHA-256 of its serialization) of an EnvProfile in the donor's profile
  // directory to prefetch from; empty = use the profile recorded for the environment, if any.
  string profile_id = 2;
}
message TaskRef { string task_id = 1; }
// Why a donor is leaving. With ttl_ms > 0 the departure is freeze-first: running tasks are
// paused, not killed, and only killed (and re-dispatched) if the donor has not come back
// after ttl_ms.
enum DepartureReason {
  DEPARTURE_UNSPECIFIED = 0;
  DEPARTURE_UNPLUG = 1;
  DEPARTURE_BATTERY = 2;
  DEPARTURE_LID = 3;
  DEPARTURE_OWNER = 4;
  DEPARTURE_SUSPEND = 5;
}

message DrainNotice {
  string node_id = 1;
  string reason = 2;
  DepartureReason code = 3;
  uint32 ttl_ms = 4;    // how long frozen tasks are held; 0 = kill-first drain
  uint32 grace_ms = 5;  // tasks expected to finish within this window keep running
}

// Served by zmd on TCP 8981 over mTLS; only pinned team peers may call anything but Admit*.
service NodeApi {
  rpc Admit(AdmitHello) returns (AdmitChallenge);
  rpc AdmitConfirm(AdmitProof) returns (Empty);
  rpc Ping(Empty) returns (PeerInfo);
  rpc OfferTask(Offer) returns (OfferReply);
  rpc PushBlobs(stream Chunk) returns (Empty);
  rpc PullBlobs(Digests) returns (stream Chunk);
  rpc SeedBlobs(SeedRequest) returns (SeedReply);
  rpc RunTask(RunRequest) returns (stream JobEvent);
  rpc CancelTask(TaskRef) returns (Empty);
  rpc Drain(DrainNotice) returns (Empty);
}
